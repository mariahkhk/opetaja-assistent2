name: Update Extension Version

on:
  push:
    branches:
      - main

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to get commit hash

      - name: Get commit information
        id: commit
        run: |
          COMMIT_ID=$(git rev-parse HEAD)
          SHORT_COMMIT_ID=$(git rev-parse --short=7 HEAD)
          echo "commitId=$COMMIT_ID" >> $GITHUB_OUTPUT
          echo "shortCommitId=$SHORT_COMMIT_ID" >> $GITHUB_OUTPUT
          echo "Commit ID: $COMMIT_ID"
          echo "Short Commit ID: $SHORT_COMMIT_ID"

      - name: Update version in Kriit API
        env:
          KRIIT_API_URL: ${{ secrets.KRIIT_API_URL }}
          KRIIT_API_KEY: ${{ secrets.EXTENSION_VERSION_API_KEY }}
        run: |
          curl -X POST "$KRIIT_API_URL/api/extensionversion/update" \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: $KRIIT_API_KEY" \
            -d "{\"commitId\":\"${{ steps.commit.outputs.commitId }}\",\"shortCommitId\":\"${{ steps.commit.outputs.shortCommitId }}\"}" \
            -f -v

      - name: Workflow status
        if: success()
        run: echo "✅ Version updated successfully in Kriit"

      - name: Workflow failure
        if: failure()
        run: echo "❌ Failed to update version in Kriit"
